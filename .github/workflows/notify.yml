name: Avisos
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency: avisos
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - run: npm ci --prefix sync --no-audit --no-fund
      - run: node sync/notify.mjs
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
