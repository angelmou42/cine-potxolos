name: Letterboxd
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: letterboxd
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node sync/letterboxd.mjs
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
      - name: Copia de seguridad diaria
        if: always()
        env:
          FB_KEY: ${{ secrets.FB_KEY }}
        run: |
          node sync/backup.mjs
          git config user.name "copia-de-seguridad"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backups
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Copia de seguridad $(TZ=Europe/Madrid date +%F)"
          git pull --rebase -q && git push -q
